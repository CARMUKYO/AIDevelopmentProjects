services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BASE_URL=http://localhost:8080
      - SERVER_DOMAIN=localhost:8080
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://shortener:shortener_pass@postgres:5432/shortener_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_PER_MIN=60
      - RATE_LIMIT_BURST=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shortener
      - POSTGRES_PASSWORD=shortener_pass
      - POSTGRES_DB=shortener_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
